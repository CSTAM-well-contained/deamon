# Gateway agent (gw-agent) — runs next to HAProxy + Keepalived on each gateway.
# Serves Criteria 2 (VRRP state / failover) and 4 (routes without reload, safe config releases).

[package]
name = "gw-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gw-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

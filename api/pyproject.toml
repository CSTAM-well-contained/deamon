# CSTAM control plane (FastAPI) — dependencies and test settings.
# Responsible for: the list of Python packages and pytest configuration.
# NOT responsible for: how the image is built (Dockerfile) or runtime settings (app/settings.py).
# Serves all criteria (the API drives provisioning, IPAM and gateways).

[project]
name = "cstam-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "docker>=7.1",
    "openstacksdk>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
